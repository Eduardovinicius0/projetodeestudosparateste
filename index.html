```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyHub | Plataforma de Estudos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-icon">🎓</div>

            <div>
                <h2>Study<span>Hub</span></h2>
                <small>Seu modo aprovação 🚀</small>
            </div>
        </div>

        <nav>

            <button class="menu active" onclick="mostrarPagina('inicio', this)">
                🏠 Início
            </button>

            <button class="menu" onclick="mostrarPagina('materias', this)">
                📚 Matérias
            </button>

            <button class="menu" onclick="mostrarPagina('questoes', this)">
                🧠 Questões
            </button>

            <button class="menu" onclick="mostrarPagina('simulado', this)">
                📝 Simulado
            </button>

            <button class="menu" onclick="mostrarPagina('flashcards', this)">
                🃏 Flashcards
            </button>

            <button class="menu" onclick="mostrarPagina('progresso', this)">
                📊 Meu progresso
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="streak">
                🔥
                <div>
                    <strong id="dias">1 dia</strong>
                    <small>de sequência</small>
                </div>
            </div>

            <button class="dark-button" onclick="modoEscuro()">
                🌙 Modo escuro
            </button>

        </div>

    </aside>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main class="main">

        <header class="topbar">

            <button class="hamburger" onclick="abrirMenu()">
                ☰
            </button>

            <div class="search">
                🔎
                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar assunto..."
                    oninput="pesquisar()"
                >
            </div>

            <div class="usuario">

                <div>
                    <span>⭐ Nível</span>
                    <strong id="nivel">1</strong>
                </div>

                <div class="avatar">
                    ED
                </div>

            </div>

        </header>


        <div id="conteudo"></div>


        <footer>
            StudyHub • Estude melhor. Aprenda mais. 🚀
        </footer>

    </main>


    <!-- =========================
         MODAL
    ========================== -->

    <div class="modal-fundo" id="modal">

        <div class="modal">

            <button class="fechar" onclick="fecharModal()">
                ×
            </button>

            <div id="modalConteudo"></div>

        </div>

    </div>


    <div class="toast" id="toast"></div>


    <script src="script.js"></script>

</body>
</html>
```
